################################################################################
#
# Data Security Platform (DSP) Common Operating Picture (COP) Docker Compose
# 
# This file is used to define the services that make up the DSP COP application.
################################################################################

### Exposed Ports ###
# 15432:5432 - COP database
# 8888:8888 - Keycloak HTTP
# 8443:8443 - Keycloak HTTPS
# 25434:5432 - Keycloak database
# 35433:5432 - DSP database
# 8080:8080 - DSP services
# 18080:8080 - NiFi

name: virtru-dsp-cop-dev

###
# The following services are primarily defined in the docker-compose.base.yaml file.
services:

#================================================================
# Start the COP database
#----------------------------------------------------------------
  cop-db:
    extends:
      file: ./compose/docker-compose.cop-db.yaml
      service: cop-db

#================================================================
# Setup the COP database
#----------------------------------------------------------------
  cop-db-setup:
    extends:
      file: ./compose/docker-compose.cop-db.yaml
      service: cop-db-setup

#================================================================
# Start the COP web server (go process + react app)
#----------------------------------------------------------------
  cop-web-server:
    extends:
      file: ./compose/docker-compose.cop-web-server.yaml
      service: cop-web-server
      
#================================================================
# Start Keycloak
#----------------------------------------------------------------
  keycloak:
    extends:
      file: ./compose/docker-compose.keycloak.yaml
      service: keycloak

#================================================================
# Provisioning Keycloak with expected realm, clients, and users 
#----------------------------------------------------------------
  dsp-keycloak-provisioning:
    extends:
      file: ./compose/docker-compose.dsp.yaml
      service: dsp-keycloak-provisioning

#================================================================
# Start the DSP database
#----------------------------------------------------------------
  dsp-db:
    extends:
      file: ./compose/docker-compose.dsp.yaml
      service: dsp-db

#================================================================
# Start the DSP services
#----------------------------------------------------------------
  dsp:
    extends:
      file: ./compose/docker-compose.dsp.yaml
      service: dsp

#================================================================
# Provision the DSP with DSP COP federal policy
#----------------------------------------------------------------
  dsp-provision-federal-policy:
    extends:
      file: ./compose/docker-compose.dsp.yaml
      service: dsp-provision-federal-policy

#================================================================
# Wait for someone needing a shell 
#----------------------------------------------------------------
  dsp-cli-user:
    extends:
      file: ./compose/docker-compose.dsp.yaml
      service: dsp-cli-user

#================================================================
# Start NiFi - EXPERIMENTAL AND NOT YET SUPPORTED
#----------------------------------------------------------------
  nifi:
    profiles: [nifi]
    extends:
      file: ./compose/docker-compose.nifi.yaml
      service: nifi

  nifi-bootstrap:
    profiles: [nifi]
    extends:
      file: ./compose/docker-compose.nifi.yaml
      service: nifi-bootstrap

  # tagging:
  #   profiles: [nifi]
  #   extends:
  #     file: ./compose/docker-compose.tagging.yaml
  #     service: tagging

#================================================================
# Start LocalStack for local AWS S3 emulation
#----------------------------------------------------------------
  # localstack:
  #   extends:
  #     file: ./compose/docker-compose.localstack.yaml
  #     service: localstack

#================================================================
# Start Minio for local AWS S3 emulation
#----------------------------------------------------------------
  minio:
    profiles: [s4]
    extends:
      file: ./compose/docker-compose.minio.yaml
      service: minio

  minio-createbuckets:
    profiles: [s4]
    extends:
      file: ./compose/docker-compose.minio.yaml
      service: minio-createbuckets

#================================================================
# Start Secure Object Proxy Service (S4) proxy
#----------------------------------------------------------------
  s4:
    profiles: [s4]
    extends:
      file: ./compose/docker-compose.secure-object-proxy.yaml
      service: s4

#================================================================
# Start Trino
#----------------------------------------------------------------
  # binfmt no longer needed — Trino image is now linux/amd64 (native on x86_64 host)
  # binfmt:
  #   image: tonistiigi/binfmt
  #   privileged: true
  #   command: --install all
  #   restart: "no"

  tdf-trino-coordinator:
    extends:
      file: ./compose/docker-compose.trino.yaml
      service: tdf-trino-coordinator
    # depends_on:
    #   binfmt:
    #     condition: service_completed_successfully

  # Workers disabled: tdf-trino v0.6.0 (479) reads the JWT from ConnectorIdentity on workers,
  # but Trino only propagates the principal name (not the JWTAwarePrincipalRecord) across
  # the wire. Single-node mode (coordinator-only) keeps the JWTAwarePrincipal in-process.
  # tdf-trino-worker-1:
  #   extends:
  #     file: ./compose/docker-compose.trino.yaml
  #     service: tdf-trino-worker-1
  #   depends_on:
  #     tdf-trino-coordinator:
  #       condition: service_started

  # tdf-trino-worker-2:
  #   extends:
  #     file: ./compose/docker-compose.trino.yaml
  #     service: tdf-trino-worker-2
  #   depends_on:
  #     tdf-trino-coordinator:
  #       condition: service_started

volumes:
  nifi-conf:
