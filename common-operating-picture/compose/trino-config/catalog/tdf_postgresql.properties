connector.name=tdf_postgresql

# PostgreSQL connection — points to the COP database
connection-url=jdbc:postgresql://local-dsp.virtru.com:15432/postgres
connection-user=postgres
connection-password=changeme

# Must match data_source.trino.policy_signing_secret in config.yaml.
tdf.policy-signing-secret=tTtc0H9rb8pHjQ5tZDYVXHMUCqjALmJHbaqOL6ab53s=

# DSP Platform endpoint
tdf.platform.endpoint=https://local-dsp.virtru.com:8080
tdf.trusted-certs-directory=/etc/trino/certs
tdf.platform.entityIdentifierMode=USERNAME
tdf.policy-column=tdf_policy

# Client credentials for entitlement calls (opentdf client from Keycloak)
tdf.entitlements.credentials=opentdf:secret
tdf.rewrap.credentials=opentdf-sdk:secret

# OIDC token exchange is primarily required by v0.6.0; disable for 476 compatibility.
tdf.oidc-token-exchange.enabled=false
tdf.oidc-token-exchange.issuer=https://local-dsp.virtru.com:8443/auth/realms/opentdf
tdf.oidc-token-exchange.client-id=opentdf-sdk
tdf.oidc-token-exchange.client-secret=secret
